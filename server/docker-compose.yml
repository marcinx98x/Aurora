services:
  aurora:
    image: marcinx98x/aurora-server:latest
    pull_policy: always
    container_name: aurora-server
    restart: unless-stopped
    ports:
      - "18000:8000"
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
