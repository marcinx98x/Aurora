<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aurora Cast</title>
  <link rel="stylesheet" href="receiver.css" />
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <div id="app" class="idle">
    <div class="stage">
      <section class="lyrics-pane" aria-label="Lyrics">
        <div id="lyrics" class="lyrics-body">
          <p class="lyrics-empty">No lyrics</p>
        </div>
      </section>
      <section class="meta-pane" aria-label="Now playing">
        <div class="title-wrap">
          <div id="title" class="title-marquee"><span>Aurora</span></div>
        </div>
        <p id="artist" class="artist"></p>
        <div class="art-wrap">
          <img id="artwork" class="artwork" alt="" />
          <div id="art-fallback" class="art-fallback">A</div>
        </div>
      </section>
    </div>
    <footer class="controls">
      <button type="button" id="btn-prev" class="ctrl" title="Previous">&#9198;</button>
      <button type="button" id="btn-play" class="ctrl ctrl-main" title="Play/Pause">&#9654;</button>
      <button type="button" id="btn-next" class="ctrl" title="Next">&#9197;</button>
      <div class="progress-block">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="times">
          <span id="time-pos">0:00</span>
          <span id="time-dur">0:00</span>
        </div>
      </div>
    </footer>
  </div>
  <script src="receiver.js"></script>
</body>
</html>
